groups:
  # properties every node has through base.yaml / pm.yaml; same name and type on both sides
  base:
    keep: [status, reg-names, interrupts-extended, interrupt-names, interrupt-parent, label,
           "#address-cells", "#size-cells", io-channels, io-channel-names, mboxes, mbox-names,
           power-domains, power-domain-names, "#power-domain-cells", hwlocks, hwlock-names,
           zephyr,deferred-init, wakeup-source, zephyr,pm-device-runtime-auto,
           zephyr,disabling-power-states]
  pinctrl_device:
    keep: [pinctrl-0, pinctrl-1, pinctrl-2, pinctrl-3, pinctrl-4, pinctrl-names]
  # SERCOM clock rules: both nodes (parent and UART) use the same clock notation
  sercom_clocks:
    properties:
      clocks: {derive: {hook: clocks_to_periph, consumes: [clock-names]}}
      atmel,assigned-clocks: {derive: {hook: assigned_clock_to_gclkperiph}}
      atmel,assigned-clock-names: {drop: "names the generator entry, which moves to gclkperiph-src on the clock controller"}
  # clock controller nodes of the old family: one node per block; the new family has one controller
  clock_block:
    properties:
      reg: {drop: "the new family has one clock controller node for all blocks"}
      atmel,assigned-clocks: {drop: "set on the consumers, handled by their assigned-clocks rule"}
      atmel,assigned-clock-names: {drop: "set on the consumers, handled by their assigned-clocks rule"}

translations:
  # ---- SERCOM UART -------------------------------------------------------------------------
  - source: atmel,sam0-uart
    target: microchip,sercom-g1-uart
    use: [base, pinctrl_device, sercom_clocks]
    note: >
      rxpo/txpo have the same enums for SAMD5/E5. dmas/dma-names are kept because the binding allows
      them, but the g1 driver has no DMA code. collision-detection exists in the target binding
      but the g1 driver does not read it.
    keep: [reg, interrupts, dma-names, clock-frequency, current-speed, hw-flow-control, parity,
           stop-bits, data-bits, rxpo, txpo, collision-detection]
    properties:
      dmas: {transform: {hook: warn_unused_dma}}
    target_only:
      clock-external: no source counterpart, no default
      run-in-standby-en: no source counterpart, target default 1
  # ---- SERCOM I2C and SPI: no target binding in Zephyr v4.3.0 (P5.0 finding 1) ----------------
  - source: atmel,sam0-i2c
    no_target: >-
      microchip,sercom-g1-i2c has no binding or driver in Zephyr v4.3.0; recheck against a current Zephyr
  - source: atmel,sam0-spi
    no_target: >-
      no microchip,sercom-g1-spi binding or driver in Zephyr v4.3.0; recheck against a current Zephyr
  # ---- SERCOM parent node ----------------------------------------------------------------
  - source: atmel,sam0-sercom
    target: microchip,sercom-g1
    use: [base, sercom_clocks]
    keep: [reg, interrupts, dmas, dma-names]
  # ---- GPIO / PORT ---------------------------------------------------------------------------
  - source: atmel,sam0-gpio
    target: microchip,port-g1-gpio
    use: [base]
    keep: [reg, gpio-controller, "#gpio-cells", ngpios, gpio-reserved-ranges, gpio-line-names]
    properties:
      "#atmel,pin-cells": {rename: "#microchip,pin-cells"}
  # ---- pinctrl container and its children (state node and pin group) ----------------------------
  - source: atmel,sam0-pinctrl
    target: microchip,port-g1-pinctrl
    use: [base]
    keep: [ranges]
  - source: atmel,sam0-pinctrl/child
    target: microchip,port-g1-pinctrl/child
    emit_compatible: false
    note: Child nodes have no compatible; the source/target names mark them as children of the pin controller.
    keep: [bias-pull-up, bias-pull-down, drive-strength, input-enable, output-enable, phandle]
    properties:
      pinmux: {transform: {map: pin_renames}}
  - source: atmel,sam0-pinmux
    no_target: the new port has one pin controller node with ranges and no pinmux nodes; drop the node
  # ---- clock controllers -------------------------------------------------------------------
  - source: atmel,sam0-gclk
    target: microchip,sam-d5x-e5x-gclkperiph
    use: [base, clock_block]
    properties:
      "#clock-cells": {transform: {const: 1}}
