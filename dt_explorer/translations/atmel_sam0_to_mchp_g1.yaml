# Binding translation: old SAM0 driver family (atmel,sam0-*) -> Microchip g1 family.
# Format: see the module docstring of dt_explorer/core/translate.py.
# Basis: docs/research/binding_pairs.md (P5.0, P5.2b). UART, GPIO, pinctrl, clocks checked against Zephyr v4.3.0;
# I2C and SPI against Zephyr main (4.5.0-rc1), which is the first with those target bindings.
#
# Pin macro renames are a value map (table pin_renames), not a hook: it is plain data, and a
# community translation for another pair can use the same mechanism without Python.
# The tables pin_renames, mclk_periph and gclk_periph are generated by the script in
# docs/evidence/P5.2.md; do not edit them by hand.
schema_version: 1
name: atmel_sam0_to_mchp_g1
hooks: atmel_sam0_to_mchp_g1.py

tables:
  # labels of the target clock controller and its children in the target SoC .dtsi
  labels: {controller: clock, mclk: mclkperiph, gclk: gclkperiph, rtc: rtcclock}
  # MCLK mask register offset -> bus index of MCHP_CLOCK_DERIVE_ID (0 AHB, 1..4 APBA..APBD).
  # 0x14..0x20 verified against both SoC .dtsi files; 0x10 (AHB) is from the datasheet only.
  mclk_bus: {0x10: 0, 0x14: 1, 0x18: 2, 0x1C: 3, 0x20: 4}
